<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FZR Cloud Dashboard</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
            background: #1a1a2e;
            color: #fff;
            text-align: center;
            padding: 20px;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { color: #00d2ff; margin-bottom: 5px; }
        .status-badge {
            background: rgba(0, 255, 100, 0.2);
            color: #00ff64;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            margin-bottom: 20px;
            border: 1px solid #00ff64;
        }
        .grid {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 20px;
            width: 100%;
            max-width: 600px;
        }
        .card {
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 12px;
            width: 120px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .card h3 {
            margin: 0 0 10px 0;
            font-size: 14px;
            color: #888;
        }
        .card p {
            margin: 0;
            font-size: 22px;
            font-weight: bold;
        }
        .safe { color: #00ff64; }
        .warning { color: #ffc800; }
        .forbidden { color: #ff3232; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0.3; } }
        
        .radar-container {
            background: #0a0a1a;
            border-radius: 160px 160px 0 0;
            border: 2px solid #00d2ff;
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.2);
            margin-top: 10px;
            position: relative;
        }
        canvas { display: block; }
    </style>
</head>
<body>

    <h1>🛡️ FZR Cloud Dashboard</h1>
    <div class="status-badge" id="connectionStatus">جاري الاتصال بالسحابة...</div>

    <div class="grid">
        <div class="card">
            <h3>الحالة / Zone</h3>
            <p id="zoneVal">---</p>
        </div>
        <div class="card">
            <h3>المسافة / Dist</h3>
            <p id="distVal">---</p>
        </div>
        <div class="card">
            <h3>الزاوية / Angle</h3>
            <p id="angleVal">---</p>
        </div>
        <div class="card">
            <h3>الطلقات / Shots</h3>
            <p id="shotsVal">0</p>
        </div>
    </div>

    <div class="radar-container">
        <canvas id="radarCanvas" width="320" height="180"></canvas>
    </div>

    <!-- استدعاء مكتبات Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-database.js";

        // إعدادات Firebase الخاصة بك
        const firebaseConfig = {
            apiKey: "AIzaSyB32kWRulIDJ-Rkp0D-aFdRC6rZMNhMvX4",
            databaseURL: "https://fzr-protection-system-default-rtdb.firebaseio.com"
        };

        // تهيئة Firebase
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        
        // قراءة البيانات من مسار /radar
        const radarRef = ref(db, 'radar');

        const canvas = document.getElementById('radarCanvas');
        const ctx = canvas.getContext('2d');
        const cx = 160;
        const cy = 170;
        const R = 150;
        const MAXD = 100; // أقصى مسافة للرسم

        let points = {}; // لتخزين النقاط المكتشفة

        function getColor(zone) {
            if (zone === 'FORBIDDEN') return '#ff3232';
            if (zone === 'WARNING') return '#ffc800';
            return '#00ff64';
        }

        function drawRadar(logicalAngle, dist, zone) {
            ctx.clearRect(0, 0, 320, 180);

            // 1. رسم شبكة الرادار (دوائر وزوايا)
            ctx.strokeStyle = 'rgba(0, 210, 255, 0.2)';
            ctx.lineWidth = 1;
            for (let k = 1; k <= 3; k++) {
                ctx.beginPath();
                ctx.arc(cx, cy, R * k / 3, Math.PI, 2 * Math.PI);
                ctx.stroke();
            }
            for (let a = 0; a <= 180; a += 30) {
                const r = a * Math.PI / 180;
                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.lineTo(cx + R * Math.cos(r), cy - R * Math.sin(r));
                ctx.stroke();
            }

            // 2. رسم شعاع المسح المتزامن
            // الزاوية المنطقية 0 تعني المنتصف (للأعلى). -90 يسار، +90 يمين
            // نقوم بتحويلها لتناسب رسمة الكانفس
            const sweepAngle = (90 - logicalAngle) * Math.PI / 180;
            
            ctx.strokeStyle = 'rgba(0, 210, 255, 0.9)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.lineTo(cx + R * Math.cos(sweepAngle), cy - R * Math.sin(sweepAngle));
            ctx.stroke();

            // 3. رسم النقاط المكتشفة (إذا كانت المسافة صالحة)
            if (dist > 0 && dist < MAXD) {
                points[logicalAngle] = { d: dist, z: zone };
            } else {
                delete points[logicalAngle]; // إزالة النقطة إذا لم يعد هناك جسم
            }

            for (const key in points) {
                const p = points[key];
                const pAngle = (90 - parseFloat(key)) * Math.PI / 180;
                const pRadius = Math.min(p.d / MAXD, 1) * R;
                
                ctx.beginPath();
                ctx.arc(cx + pRadius * Math.cos(pAngle), cy - pRadius * Math.sin(pAngle), 5, 0, 2 * Math.PI);
                ctx.fillStyle = getColor(p.z);
                ctx.fill();
            }
        }

        // الاستماع لأي تغيير في بيانات Firebase
        onValue(radarRef, (snapshot) => {
            const data = snapshot.val();
            const statusBadge = document.getElementById('connectionStatus');

            if (data) {
                statusBadge.innerText = "متصل بالسحابة (Live)";
                statusBadge.style.background = "rgba(0, 255, 100, 0.2)";
                statusBadge.style.color = "#00ff64";
                statusBadge.style.borderColor = "#00ff64";

                // تحديث الأرقام في الشاشة
                document.getElementById('distVal').innerText = (data.distance === 0 || data.distance >= 400) ? '---' : data.distance;
                document.getElementById('angleVal').innerText = (data.angle || 0) + '°';
                document.getElementById('shotsVal').innerText = data.shots || 0;
                
                const zoneEl = document.getElementById('zoneVal');
                zoneEl.innerText = data.zone || '---';
                zoneEl.className = (data.zone || 'SAFE').toLowerCase();

                // رسم الرادار المتزامن
                drawRadar(data.angle || 0, data.distance || 0, data.zone || 'SAFE');
            } else {
                statusBadge.innerText = "في انتظار البيانات...";
            }
        }, (error) => {
            console.error("Error reading data: ", error);
            document.getElementById('connectionStatus').innerText = "خطأ في الاتصال بالسحابة";
            document.getElementById('connectionStatus').style.color = "red";
            document.getElementById('connectionStatus').style.borderColor = "red";
        });
    </script>
</body>
</html>
